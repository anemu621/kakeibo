<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="家計簿">
<link rel="apple-touch-icon" href="icon.png">
<title>家計簿</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap');

  :root{
    --bg:#E8F3F6;
    --ink:#2B2B28;
    --card:#FFFFFF;
    --border:#C9E3EA;
    --divider:#DCEEF2;
    --line:#B9D9E1;
    --muted:#5E7C87;
    --muted2:#8FADB6;
    --mint:#A8D8C9;
    --coral:#E8776C;
    --coral-soft:#EFA9A2;
    --blue-soft:#A9CFE0;
    --green:#5C8A6F;
    --red:#C0554E;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);font-family:'Zen Kaku Gothic New','Hiragino Sans',sans-serif;color:var(--ink);
    padding-bottom:env(safe-area-inset-bottom);}
  header{padding:calc(env(safe-area-inset-top) + 20px) 20px 16px;background:#2B2B28;}
  header .row{display:flex;align-items:center;gap:8px;}
  header h1{font-family:'Zen Maru Gothic',sans-serif;font-size:19px;font-weight:700;color:var(--bg);margin:0;letter-spacing:.02em;}
  header p{font-size:12px;color:#9A9587;margin:4px 0 0;}

  .tabs{display:flex;position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--border);}
  .tabs button{flex:1;padding:12px 0;font-size:14px;font-weight:500;color:var(--muted2);background:none;border:none;position:relative;font-family:inherit;}
  .tabs button.active{color:var(--ink);}
  .tabs button.active::after{content:"";position:absolute;left:16px;right:16px;bottom:-1px;height:2px;background:var(--coral);}

  main{padding:20px;max-width:480px;margin:0 auto;}
  .hidden{display:none !important;}

  .rowline{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
  input[type=date]{font-size:15px;font-weight:500;background:transparent;border:none;color:var(--ink);font-family:inherit;}
  .muted{font-size:13px;color:var(--muted);}
  .total-strong{color:var(--ink);font-weight:600;}

  .card{background:var(--card);border:1px solid var(--border);border-radius:8px;overflow:hidden;}
  .cat-row{display:flex;align-items:center;gap:8px;padding:8px 12px;border-top:1px solid var(--divider);}
  .cat-row:first-child{border-top:none;}
  .cat-name{width:96px;flex-shrink:0;font-size:14px;}
  .cat-name.empty{color:var(--muted2);}
  .ledger-input{width:100%;background:transparent;border:none;border-bottom:1px solid var(--line);outline:none;font-size:15px;padding:4px 0;text-align:right;color:var(--ink);font-family:inherit;font-variant-numeric:tabular-nums;}
  .ledger-input.left{text-align:left;}
  .catname-input{flex:1;background:transparent;border:none;border-bottom:1px solid var(--line);outline:none;font-size:14px;padding:4px 0;color:var(--ink);font-family:inherit;}

  .iconbtn{background:none;border:none;padding:4px;opacity:.6;cursor:pointer;}
  .iconbtn:hover{opacity:1;}
  .move-btns{display:flex;flex-direction:column;gap:2px;}
  .movebtn{background:none;border:none;padding:0;font-size:11px;line-height:1;color:var(--muted2);cursor:pointer;}
  .movebtn:disabled{opacity:.25;cursor:default;}
  .footer-btn{width:100%;display:flex;align-items:center;justify-content:center;gap:6px;padding:10px 0;font-size:13px;background:none;border:none;font-family:inherit;cursor:pointer;}
  .footer-btn.green{color:var(--green);}
  .footer-btn.muted{color:var(--muted);}
  .footer-btn.strong{color:var(--ink);font-weight:500;}
  .split-footer{display:flex;}
  .split-footer button{flex:1;}

  .tape{display:inline-block;padding:2px 8px;border-radius:2px;font-size:13px;font-weight:500;color:var(--ink);}

  .empty-hint{padding:12px;font-size:13px;color:var(--muted2);}

  .section{margin-bottom:20px;}
  .section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}

  .totals-card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:12px 16px;}
  .totals-line{display:flex;justify-content:space-between;padding:4px 0;font-size:14px;}
  .totals-line .label{color:var(--muted);}
  .totals-line.result{border-top:1px solid var(--divider);margin-top:4px;padding-top:10px;font-size:15px;font-weight:600;}
  .totals-line.result .label{color:var(--ink);}

  .period-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;}
  .navbtn{background:var(--card);border:1px solid var(--border);border-radius:999px;padding:6px 10px;cursor:pointer;font-size:15px;color:var(--ink);font-family:inherit;}
  .period-nav .label{font-size:14px;font-weight:500;display:flex;align-items:center;gap:6px;}

  .recent-list button{width:100%;display:flex;justify-content:space-between;padding:8px 12px;font-size:13px;background:var(--card);border:none;border-top:1px solid var(--divider);font-family:inherit;cursor:pointer;color:var(--ink);}
  .recent-list button:first-child{border-top:none;}

  textarea#memo{width:100%;min-height:60vh;border-radius:8px;padding:12px;font-size:14px;outline:none;background:var(--card);border:1px solid var(--border);color:var(--ink);line-height:1.8;font-family:inherit;resize:vertical;}
  .memo-hint{font-size:13px;color:var(--muted);margin-bottom:8px;}

  .calc-display{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:24px 16px;text-align:right;font-size:38px;font-weight:500;font-variant-numeric:tabular-nums;margin-bottom:12px;overflow-x:auto;white-space:nowrap;color:var(--ink);}
  .calc-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;}
  .calc-btn{width:100%;height:64px;border:1px solid var(--border);border-radius:8px;background:var(--card);font-size:20px;font-family:inherit;color:var(--ink);cursor:pointer;}
  .calc-btn:active{background:var(--divider);}
  .calc-op{background:var(--blue-soft);color:var(--ink);}
  .calc-fn{background:var(--divider);color:var(--muted);font-size:16px;}
  .calc-eq{background:var(--coral);color:#fff;}
</style>
</head>
<body>

<header>
  <div class="row">📔<h1>家計簿</h1></div>
  <p>手書き家計簿をそのままアプリに</p>
</header>

<div class="tabs">
  <button id="tab-daily" class="active" onclick="switchTab('daily')">日別</button>
  <button id="tab-monthly" onclick="switchTab('monthly')">月次</button>
  <button id="tab-memo" onclick="switchTab('memo')">メモ</button>
  <button id="tab-calc" onclick="switchTab('calc')">電卓</button>
</div>

<main>
  <!-- 日別 -->
  <div id="panel-daily">
    <div class="rowline">
      <div style="display:flex;align-items:center;gap:6px;">
        <button class="navbtn" onclick="shiftDay(-1)">‹</button>
        <input type="date" id="date-picker">
        <button class="navbtn" onclick="shiftDay(1)">›</button>
      </div>
      <span class="muted">この日の合計 <span class="total-strong" id="daily-total">¥0</span></span>
    </div>
    <div class="card" id="daily-cats"></div>

  </div>

  <!-- 月次 -->
  <div id="panel-monthly" class="hidden">
    <div class="period-nav">
      <button class="navbtn" onclick="shiftPeriod(-1)">‹</button>
      <div class="label">🗓️ <span id="period-label"></span></div>
      <button class="navbtn" onclick="shiftPeriod(1)">›</button>
    </div>

    <div id="section-income" class="section"></div>
    <div id="section-fixed" class="section"></div>
    <div id="section-variable" class="section"></div>
    <div id="section-savings" class="section"></div>

    <div class="section">
      <div class="section-head">
        <span class="tape" style="background:var(--mint);">日々の記録（自動集計）</span>
        <span class="muted">小計 <span class="total-strong" id="daily-agg-total">¥0</span></span>
      </div>
      <div class="card" id="daily-agg-list"></div>
      <p class="muted" style="font-size:12px;margin-top:6px;">「日別」タブで記録した内容が、この期間分だけ自動で集計されます</p>
    </div>

    <div class="totals-card">
      <div class="totals-line"><span class="label">収入合計</span><span id="t-income">¥0</span></div>
      <div class="totals-line"><span class="label">支出合計</span><span id="t-expense">¥0</span></div>
      <div class="totals-line"><span class="label">生活費合計（日々の記録の合計）</span><span id="t-living">¥0</span></div>
      <div class="totals-line result"><span class="label">今月の結果</span><span id="t-result">¥0</span></div>
    </div>
  </div>

  <!-- メモ -->
  <div id="panel-memo" class="hidden">
    <div class="memo-hint">自由に書けるメモです。買いたいもの、来月への申し送りなど何でもどうぞ</div>
    <textarea id="memo" placeholder="ここにメモを入力…"></textarea>
  </div>

  <!-- 電卓 -->
  <div id="panel-calc" class="hidden">
    <div class="calc-display" id="calc-display">0</div>
    <div class="calc-grid">
      <button class="calc-btn calc-fn" data-calc="clear">C</button>
      <button class="calc-btn calc-fn" data-calc="backspace">⌫</button>
      <button class="calc-btn calc-fn" data-calc="percent">%</button>
      <button class="calc-btn calc-op" data-calc="op" data-op="÷">÷</button>

      <button class="calc-btn" data-calc="digit" data-digit="7">7</button>
      <button class="calc-btn" data-calc="digit" data-digit="8">8</button>
      <button class="calc-btn" data-calc="digit" data-digit="9">9</button>
      <button class="calc-btn calc-op" data-calc="op" data-op="×">×</button>

      <button class="calc-btn" data-calc="digit" data-digit="4">4</button>
      <button class="calc-btn" data-calc="digit" data-digit="5">5</button>
      <button class="calc-btn" data-calc="digit" data-digit="6">6</button>
      <button class="calc-btn calc-op" data-calc="op" data-op="−">−</button>

      <button class="calc-btn" data-calc="digit" data-digit="1">1</button>
      <button class="calc-btn" data-calc="digit" data-digit="2">2</button>
      <button class="calc-btn" data-calc="digit" data-digit="3">3</button>
      <button class="calc-btn calc-op" data-calc="op" data-op="+">+</button>

      <button class="calc-btn" data-calc="digit" data-digit="0" style="grid-column:span 2;">0</button>
      <button class="calc-btn" data-calc="dot">.</button>
      <button class="calc-btn calc-eq" data-calc="equals">=</button>
    </div>
  </div>
</main>

<script>
/* ---------- storage (localStorage) ---------- */
const LS = {
  get(key, fallback){ try{ const v = localStorage.getItem(key); return v==null?fallback:JSON.parse(v);}catch(e){return fallback;} },
  set(key, val){ try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){} }
};
const LS_TEXT = {
  get(key, fallback){ const v = localStorage.getItem(key); return v==null?fallback:v; },
  set(key, val){ try{ localStorage.setItem(key, val); }catch(e){} }
};

const DEFAULT_CATEGORIES = [];

let categories = LS.get("kakeibo:settings", {categories: DEFAULT_CATEGORIES}).categories;
let dailyEntries = LS.get("kakeibo:daily-entries", {});
let periods = LS.get("kakeibo:periods", {});
let memo = LS_TEXT.get("kakeibo:memo", "");
let editingCats = false;

/* ---------- date / period helpers ---------- */
const pad = n => String(n).padStart(2,"0");
function todayStr(){ const d=new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }

function periodKeyForDate(dateStr){
  const [y,m,d] = dateStr.split("-").map(Number);
  if(d>=15) return `${y}-${pad(m)}`;
  const pm = m===1?12:m-1, py = m===1?y-1:y;
  return `${py}-${pad(pm)}`;
}
function periodLabel(pk){
  const [y,m]=pk.split("-").map(Number);
  const em=m===12?1:m+1, ey=m===12?y+1:y;
  return `${y}年 ${m}/15 〜 ${ey===y?"":ey+"年"}${em}/14`.replace("  "," ");
}
function shiftPeriodKey(pk, delta){
  let [y,m]=pk.split("-").map(Number);
  m+=delta;
  while(m>12){m-=12;y+=1;}
  while(m<1){m+=12;y-=1;}
  return `${y}-${pad(m)}`;
}
function dateInPeriod(dateStr, pk){
  const [py,pm]=pk.split("-").map(Number);
  const start=new Date(py,pm-1,15);
  const em=pm===12?1:pm+1, ey=pm===12?py+1:py;
  const end=new Date(ey,em-1,14);
  const [dy,dm,dd]=dateStr.split("-").map(Number);
  const d=new Date(dy,dm-1,dd);
  return d>=start && d<=end;
}
const yen = n => `¥${Math.round(n||0).toLocaleString("ja-JP")}`;
const emptyPeriodData = () => ({income:[], fixed:[], variable:[], savings:[]});

let selectedDate = todayStr();
let periodKey = periodKeyForDate(todayStr());

/* ---------- tabs ---------- */
function switchTab(tab){
  ["daily","monthly","memo","calc"].forEach(t=>{
    document.getElementById("panel-"+t).classList.toggle("hidden", t!==tab);
    document.getElementById("tab-"+t).classList.toggle("active", t===tab);
  });
  if(tab==="monthly") renderMonthly();
}

/* ---------- daily panel ---------- */
function renderDaily(){
  document.getElementById("date-picker").value = selectedDate;
  const entry = dailyEntries[selectedDate] || {};
  const wrap = document.getElementById("daily-cats");
  wrap.innerHTML = "";

  if(categories.length===0 && !editingCats){
    const hint = document.createElement("div");
    hint.className = "empty-hint";
    hint.textContent = "＋ カテゴリを追加して、記録を始めましょう";
    wrap.appendChild(hint);
  }

  categories.forEach((cat, idx) => {
    const row = document.createElement("div");
    row.className = "cat-row";
    if(editingCats){
      row.innerHTML = `
        <div class="move-btns">
          <button class="movebtn" data-move-up="${idx}" ${idx===0?"disabled":""}>▲</button>
          <button class="movebtn" data-move-down="${idx}" ${idx===categories.length-1?"disabled":""}>▼</button>
        </div>
        <input class="catname-input" value="${escapeAttr(cat)}" placeholder="カテゴリ名を入力" data-idx="${idx}">
        <button class="iconbtn" data-remove="${idx}">🗑</button>`;
    } else {
      const val = entry[cat] ?? "";
      row.innerHTML = `
        <div class="cat-name ${cat?"":"empty"}">${cat || "（無題）"}</div>
        <input class="ledger-input" type="number" inputmode="decimal" placeholder="0" value="${val}" data-cat="${escapeAttr(cat)}">`;
    }
    wrap.appendChild(row);
  });

  const footer = document.createElement("div");
  if(editingCats){
    footer.className = "split-footer";
    footer.innerHTML = `
      <button class="footer-btn green" id="add-cat">＋ カテゴリ追加</button>
      <button class="footer-btn strong" id="done-cats">✓ 完了</button>`;
  } else {
    footer.innerHTML = `<button class="footer-btn muted" id="edit-cats">✎ カテゴリを編集</button>`;
  }
  wrap.appendChild(footer);

  // wire events
  if(editingCats){
    wrap.querySelectorAll(".catname-input").forEach(inp=>{
      inp.addEventListener("input", e=>{
        categories[+e.target.dataset.idx] = e.target.value;
      });
    });
    wrap.querySelectorAll("[data-remove]").forEach(btn=>{
      btn.addEventListener("click", e=>{
        const idx = +e.target.dataset.remove;
        const removed = categories[idx];
        categories = categories.filter((_,i)=>i!==idx);
        Object.keys(dailyEntries).forEach(d=>{ delete dailyEntries[d][removed]; });
        renderDaily();
      });
    });
    wrap.querySelectorAll("[data-move-up]").forEach(btn=>{
      btn.addEventListener("click", e=>{
        const idx = +e.target.dataset.moveUp;
        if(idx>0){
          [categories[idx-1], categories[idx]] = [categories[idx], categories[idx-1]];
          renderDaily();
        }
      });
    });
    wrap.querySelectorAll("[data-move-down]").forEach(btn=>{
      btn.addEventListener("click", e=>{
        const idx = +e.target.dataset.moveDown;
        if(idx<categories.length-1){
          [categories[idx+1], categories[idx]] = [categories[idx], categories[idx+1]];
          renderDaily();
        }
      });
    });
    document.getElementById("add-cat").addEventListener("click", ()=>{ categories.push(""); renderDaily(); });
    document.getElementById("done-cats").addEventListener("click", ()=>{
      editingCats = false;
      LS.set("kakeibo:settings", {categories});
      LS.set("kakeibo:daily-entries", dailyEntries);
      renderDaily();
    });
  } else {
    wrap.querySelectorAll(".ledger-input").forEach(inp=>{
      inp.addEventListener("input", e=>{
        const cat = e.target.dataset.cat;
        const cleaned = e.target.value.replace(/[^0-9.]/g,"");
        if(!dailyEntries[selectedDate]) dailyEntries[selectedDate] = {};
        dailyEntries[selectedDate][cat] = cleaned;
        LS.set("kakeibo:daily-entries", dailyEntries);
        updateDailyTotal();
      });
    });
    document.getElementById("edit-cats").addEventListener("click", ()=>{ editingCats = true; renderDaily(); });
  }

  updateDailyTotal();
}

function updateDailyTotal(){
  const entry = dailyEntries[selectedDate] || {};
  const total = Object.values(entry).reduce((s,v)=>s+(parseFloat(v)||0),0);
  document.getElementById("daily-total").textContent = yen(total);
}

document.getElementById("date-picker").addEventListener("change", e=>{
  selectedDate = e.target.value;
  renderDaily();
});

function shiftDay(delta){
  const [y,m,d] = selectedDate.split("-").map(Number);
  const dt = new Date(y, m-1, d);
  dt.setDate(dt.getDate() + delta);
  selectedDate = `${dt.getFullYear()}-${pad(dt.getMonth()+1)}-${pad(dt.getDate())}`;
  renderDaily();
}

/* ---------- monthly panel ---------- */
function getPeriodData(pk){ return periods[pk] || emptyPeriodData(); }
function setPeriodSection(pk, section, rows){
  periods[pk] = { ...getPeriodData(pk), [section]: rows };
  LS.set("kakeibo:periods", periods);
}

function renderSection(containerId, title, tapeColor, section, unitLabel){
  const rows = getPeriodData(periodKey)[section];
  const total = rows.reduce((s,r)=>s+(parseFloat(r.amount)||0),0);
  const el = document.getElementById(containerId);
  el.innerHTML = `
    <div class="section-head">
      <span class="tape" style="background:${tapeColor};">${title}</span>
      <span class="muted">小計 <span class="total-strong">${yen(total)}</span></span>
    </div>
    <div class="card" id="${containerId}-rows"></div>`;
  const rowsWrap = document.getElementById(containerId+"-rows");

  if(rows.length===0){
    const hint = document.createElement("div");
    hint.className = "empty-hint";
    hint.textContent = `＋ で${unitLabel}を追加できます`;
    rowsWrap.appendChild(hint);
  }
  rows.forEach((r, idx)=>{
    const row = document.createElement("div");
    row.className = "cat-row";
    row.innerHTML = `
      <div class="move-btns">
        <button class="movebtn" data-move-up="${idx}" ${idx===0?"disabled":""}>▲</button>
        <button class="movebtn" data-move-down="${idx}" ${idx===rows.length-1?"disabled":""}>▼</button>
      </div>
      <input class="ledger-input left" style="flex:1;" placeholder="項目名" value="${escapeAttr(r.label)}" data-field="label" data-idx="${idx}">
      <input class="ledger-input" style="width:96px;" type="number" inputmode="decimal" placeholder="0" value="${r.amount}" data-field="amount" data-idx="${idx}">
      <button class="iconbtn" data-remove="${idx}">🗑</button>`;
    rowsWrap.appendChild(row);
  });
  const addBtn = document.createElement("button");
  addBtn.className = "footer-btn green";
  addBtn.textContent = "＋ 追加";
  rowsWrap.appendChild(addBtn);

  rowsWrap.querySelectorAll("[data-field]").forEach(inp=>{
    inp.addEventListener("input", e=>{
      const idx = +e.target.dataset.idx;
      const field = e.target.dataset.field;
      const rows = getPeriodData(periodKey)[section];
      rows[idx][field] = field==="amount" ? e.target.value.replace(/[^0-9.]/g,"") : e.target.value;
      setPeriodSection(periodKey, section, rows);
      renderTotals();
      // keep the just-typed subtotal fresh without a full re-render (avoid losing focus)
      const total = rows.reduce((s,r)=>s+(parseFloat(r.amount)||0),0);
      el.querySelector(".total-strong").textContent = yen(total);
    });
  });
  rowsWrap.querySelectorAll("[data-remove]").forEach(btn=>{
    btn.addEventListener("click", e=>{
      const idx = +e.target.dataset.remove;
      const rows = getPeriodData(periodKey)[section].filter((_,i)=>i!==idx);
      setPeriodSection(periodKey, section, rows);
      renderSection(containerId, title, tapeColor, section, unitLabel);
      renderTotals();
    });
  });
  rowsWrap.querySelectorAll("[data-move-up]").forEach(btn=>{
    btn.addEventListener("click", e=>{
      const idx = +e.target.dataset.moveUp;
      const rows = getPeriodData(periodKey)[section];
      if(idx>0){
        [rows[idx-1], rows[idx]] = [rows[idx], rows[idx-1]];
        setPeriodSection(periodKey, section, rows);
        renderSection(containerId, title, tapeColor, section, unitLabel);
      }
    });
  });
  rowsWrap.querySelectorAll("[data-move-down]").forEach(btn=>{
    btn.addEventListener("click", e=>{
      const idx = +e.target.dataset.moveDown;
      const rows = getPeriodData(periodKey)[section];
      if(idx<rows.length-1){
        [rows[idx+1], rows[idx]] = [rows[idx], rows[idx+1]];
        setPeriodSection(periodKey, section, rows);
        renderSection(containerId, title, tapeColor, section, unitLabel);
      }
    });
  });
  addBtn.addEventListener("click", ()=>{
    const rows = [...getPeriodData(periodKey)[section], {label:"", amount:""}];
    setPeriodSection(periodKey, section, rows);
    renderSection(containerId, title, tapeColor, section, unitLabel);
  });
}

function dailyByCategoryForPeriod(pk){
  const agg = {};
  categories.forEach(c=>agg[c]=0);
  Object.entries(dailyEntries).forEach(([date, entry])=>{
    if(!dateInPeriod(date, pk)) return;
    Object.entries(entry).forEach(([cat,val])=>{
      agg[cat] = (agg[cat]||0) + (parseFloat(val)||0);
    });
  });
  return agg;
}

function renderMonthly(){
  document.getElementById("period-label").textContent = periodLabel(periodKey);
  renderSection("section-income", "収入", "var(--blue-soft)", "income", "収入");
  renderSection("section-fixed", "固定支出", "var(--coral-soft)", "fixed", "項目");
  renderSection("section-variable", "変動支出", "var(--coral-soft)", "variable", "項目");
  renderSection("section-savings", "積立", "var(--coral-soft)", "savings", "項目");

  const agg = dailyByCategoryForPeriod(periodKey);
  const aggTotal = Object.values(agg).reduce((s,v)=>s+v,0);
  document.getElementById("daily-agg-total").textContent = yen(aggTotal);
  const list = document.getElementById("daily-agg-list");
  list.innerHTML = "";
  categories.forEach(cat=>{
    const row = document.createElement("div");
    row.className = "cat-row";
    row.innerHTML = `<span style="font-size:14px;${cat?"":"color:var(--muted2);"}">${cat||"（無題）"}</span><span style="font-size:14px;font-variant-numeric:tabular-nums;">${yen(agg[cat]||0)}</span>`;
    list.appendChild(row);
  });

  renderTotals();
}

function renderTotals(){
  const pdata = getPeriodData(periodKey);
  const sum = rows => rows.reduce((s,r)=>s+(parseFloat(r.amount)||0),0);
  const incomeTotal = sum(pdata.income);
  const fixedTotal = sum(pdata.fixed);
  const variableTotal = sum(pdata.variable);
  const savingsTotal = sum(pdata.savings);
  const agg = dailyByCategoryForPeriod(periodKey);
  const dailyTotal = Object.values(agg).reduce((s,v)=>s+v,0);

  const expenseTotal = fixedTotal + variableTotal + savingsTotal;
  const livingCostTotal = dailyTotal;
  const result = incomeTotal - expenseTotal - dailyTotal;

  document.getElementById("t-income").textContent = yen(incomeTotal);
  document.getElementById("t-expense").textContent = yen(expenseTotal);
  document.getElementById("t-living").textContent = yen(livingCostTotal);
  const resultEl = document.getElementById("t-result");
  resultEl.textContent = (result>=0?"+":"") + yen(result);
  resultEl.style.color = result>=0 ? "var(--green)" : "var(--red)";
}

function shiftPeriod(delta){
  periodKey = shiftPeriodKey(periodKey, delta);
  renderMonthly();
}

/* ---------- utils ---------- */
function escapeAttr(s){ return String(s??"").replace(/"/g,"&quot;"); }

/* ---------- calculator ---------- */
let calcDisplayVal = "0";
let calcPrevVal = null;
let calcOperator = null;
let calcWaitingForSecond = false;

const calcDisplayEl = document.getElementById("calc-display");

function calcUpdateDisplay(){
  calcDisplayEl.textContent = calcDisplayVal;
}
function calcCompute(a, b, op){
  a = parseFloat(a); b = parseFloat(b);
  switch(op){
    case "+": return a + b;
    case "−": return a - b;
    case "×": return a * b;
    case "÷": return b === 0 ? 0 : a / b;
    default: return b;
  }
}
function calcFormat(n){
  if(!isFinite(n)) return "0";
  let s = String(Math.round(n * 1e10) / 1e10);
  if(s.length > 12) s = parseFloat(n.toPrecision(10)).toString();
  return s;
}

document.querySelectorAll("[data-calc]").forEach(btn=>{
  btn.addEventListener("click", ()=>{
    const kind = btn.dataset.calc;
    if(kind === "digit"){
      const d = btn.dataset.digit;
      if(calcWaitingForSecond || calcDisplayVal === "0"){
        calcDisplayVal = d;
        calcWaitingForSecond = false;
      } else {
        calcDisplayVal += d;
      }
    } else if(kind === "dot"){
      if(calcWaitingForSecond){ calcDisplayVal = "0."; calcWaitingForSecond = false; }
      else if(!calcDisplayVal.includes(".")) calcDisplayVal += ".";
    } else if(kind === "clear"){
      calcDisplayVal = "0"; calcPrevVal = null; calcOperator = null; calcWaitingForSecond = false;
    } else if(kind === "backspace"){
      calcDisplayVal = calcDisplayVal.length > 1 ? calcDisplayVal.slice(0,-1) : "0";
    } else if(kind === "percent"){
      calcDisplayVal = calcFormat(parseFloat(calcDisplayVal) / 100);
    } else if(kind === "op"){
      if(calcPrevVal !== null && !calcWaitingForSecond){
        calcPrevVal = calcFormat(calcCompute(calcPrevVal, calcDisplayVal, calcOperator));
        calcDisplayVal = calcPrevVal;
      } else {
        calcPrevVal = calcDisplayVal;
      }
      calcOperator = btn.dataset.op;
      calcWaitingForSecond = true;
    } else if(kind === "equals"){
      if(calcOperator !== null && calcPrevVal !== null){
        calcDisplayVal = calcFormat(calcCompute(calcPrevVal, calcDisplayVal, calcOperator));
        calcPrevVal = null; calcOperator = null; calcWaitingForSecond = false;
      }
    }
    calcUpdateDisplay();
  });
});

renderDaily();
